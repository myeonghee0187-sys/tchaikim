<!-- 인트로는 독립된 진입 화면입니다.

     - 공통 헤더·푸터를 넣지 않습니다. 화면에는 영상과 START 버튼만 있고,
       그 버튼으로만 메인으로 넘어갑니다. layout.css?v=6도 불러오지 않습니다.
     - 스크롤이 없습니다. 영상이 화면을 꽉 채우고 페이지 높이가 화면 높이와
       같아서 스크롤할 것이 없습니다.
     - GSAP · ScrollTrigger · Lenis · common.js를 불러오지 않습니다.
       스크롤 연동과 헤더·푸터·부드러운 스크롤이 전부 없어져 쓸 데가 없습니다. -->
<body data-page="intro">

  <main class="intro" id="main_content">

    <!-- 두루마기 영상. Figma 'intro_open'(1561:2140) 기준 카피/아이콘.
         페이지에 들어오면 영상이 한 번 자동 재생되고(loop 없음, 끝나면 마지막
         프레임에서 멈춤), 3초 지점에서 .scroll_overlay(안내 문구·START 버튼·
         소셜 아이콘)가 나타납니다 — 두루마리가 다 펼쳐져야 그 위에 적힌 내용이
         읽히는 것과 같은 순서입니다.

         오버레이는 첫 페인트부터 숨겨져 있어 내부 텍스트가 번쩍이지 않습니다.
         자동재생이 막히면 js/intro.js가 바로 표시하며, 스크립트가 실패해도
         화면 우측 상단 SKIP 링크로 메인에 들어갈 수 있습니다. -->
    <section class="scroll" aria-labelledby="scroll_title">
      <h1 class="a11y_hidden" id="scroll_title">Tchai Kim — Where tradition finds freedom</h1>

      <a class="intro_skip" href="../main/index.html" aria-label="Skip intro and enter the Tchai Kim website">
        <span class="intro_skip_label">SKIP</span>
        <span class="intro_skip_arrow" aria-hidden="true">→</span>
      </a>

      <div class="scroll_stage">
        <video class="scroll_video" src="assets/intro.mp4" muted autoplay playsinline preload="auto" aria-hidden="true"></video>

        <div class="scroll_overlay">
          <p class="scroll_overlay_eyebrow">Where tradition finds freedom</p>

          <!-- 사이트로 들어가는 유일한 입구입니다.
               에셋 파일 이름은 brand_btn_book.png지만 그림은 START 도장입니다
               (brand 페이지에서 넘어온 이름이라 그대로 두었습니다). -->
          <a class="scroll_overlay_book" href="../main/index.html">
            <img src="assets/brand_btn_book.png" alt="Start — enter the Tchai Kim website" width="80" height="80">
          </a>

          <ul class="scroll_overlay_social">
            <li>
              <a href="https://www.instagram.com/tchaikim/" target="_blank" rel="noopener noreferrer">
                <img src="assets/icons/Instagram.svg" alt="" aria-hidden="true">
                <span class="a11y_hidden">Instagram (opens in a new tab)</span>
              </a>
            </li>
            <li>

                <span class="a11y_hidden">Facebook (opens in a new tab)</span>
              </a>
            </li>
          </ul>
        </div>
